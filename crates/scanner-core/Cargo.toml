[package]
name = "scanner-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Shipped to users through the npm package only.
publish = false
description = "High-performance QR code and barcode scanning engine in pure Rust"

[features]
default = ["file-io"]
# Enables `Scanner::scan_file` and image codecs (PNG, JPEG, GIF, WebP).
# Disabled for the WASM build: the browser decodes images itself.
file-io = ["image/png", "image/jpeg", "image/gif", "image/webp"]

[dependencies]
rxing.workspace = true
image = { workspace = true }
imageproc = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
web-time = "1.1"

[dev-dependencies]
criterion = { workspace = true }
# Encoders are only used to synthesise test codes.
rxing = { workspace = true, features = ["encoders"] }
env_logger = { workspace = true }

[[bench]]
name = "scan_benchmark"
harness = false

[lints]
workspace = true
