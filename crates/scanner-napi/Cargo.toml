[package]
name = "scanner-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node.js native addon for the scanner QR/barcode library"

[lib]
crate-type = ["cdylib"]

[dependencies]
scanner-core = { path = "../scanner-core" }
napi = { version = "2", features = ["napi9", "async"] }
napi-derive = "2"
serde = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = "2"
