[package]
name = "scanner-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly bindings for the scanner QR/barcode library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scanner-core = { path = "../scanner-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
tsify = "0.4"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
chrono = { version = "0.4", features = ["wasmbind"] }
web-sys = { version = "0.3.102", features = ["console"] }
[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
