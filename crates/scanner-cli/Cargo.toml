[package]
name = "scanner-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for QR code and barcode scanning"

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
scanner-core = { path = "../scanner-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
colored = "2"
env_logger = { workspace = true }
log = { workspace = true }
nokhwa = { version = "0.10", default-features = false, features = ["input-native", "output-threaded", "decoding"] }
ctrlc = "3"
