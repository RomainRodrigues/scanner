[workspace]
resolver = "2"

members = [
    "crates/scanner-core",
    "crates/scanner-wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["scanner"]
license = "MIT"
repository = "https://github.com/romainrodrigues/scanner"

[workspace.dependencies]
# Core scanning engine.
# Default features are disabled on purpose: they pull in encoders, ~15 image
# codecs and `client_support` (chrono-tz, regex…) which bloat the WASM binary
# and are never used by a scanner.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "encoding_rs",
    "multi_barcode_readers",
    "qrcode",
    "datamatrix",
    "aztec",
    "pdf417",
    "oned",
] }

# Image processing
image = { version = "0.25", default-features = false }
imageproc = { version = "0.25", default-features = false }

# Error handling & utilities
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
