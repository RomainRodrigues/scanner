<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scanner demo</title>
  <style>
    :root {
      --bg: #0f0f14; --surface: #1a1a24; --border: #2a2a3a;
      --accent: #00d4aa; --text: #e8e8f0; --dim: #8a8a9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; padding: 16px;
    }
    main { width: 100%; max-width: 760px; display: grid; gap: 16px; }
    h1 { font-size: 1.2rem; margin: 0; }
    h1 span { color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    #scanner { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    button, select {
      font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--border); color: var(--text); cursor: pointer;
    }
    button.primary { background: var(--accent); color: #002b22; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .4; cursor: default; }
    #stats { font: 12px ui-monospace, monospace; color: var(--dim); margin-left: auto; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    li { border-left: 3px solid var(--accent); background: var(--bg); padding: 8px 12px; border-radius: 6px; }
    li b { word-break: break-all; }
    li small { color: var(--dim); display: block; }
    .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; color: var(--dim); cursor: pointer; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
<main>
  <h1>Scanner<span>.web</span> — QR & barcode demo</h1>

  <section class="card">
    <div id="scanner"></div>
    <div class="row">
      <button id="start" class="primary">Start camera</button>
      <button id="stop" disabled>Stop</button>
      <select id="formats" aria-label="Formats">
        <option value="">All formats</option>
        <option value="qr_code">QR only</option>
        <option value="ean_13,ean_8,upc_a,upc_e">Retail (EAN / UPC)</option>
        <option value="code_128,code_39,itf,data_matrix">Logistics</option>
      </select>
      <span id="stats"></span>
    </div>
  </section>

  <section class="card">
    <label class="drop" id="drop">Drop an image here or click to choose a file
      <input id="file" type="file" accept="image/*" hidden />
    </label>
  </section>

  <section class="card">
    <ul id="results"><li><small>Nothing scanned yet.</small></li></ul>
  </section>
</main>

<script type="module">
  import { BarcodeReader, scanImage } from '../dist/index.js';

  const $ = (id) => document.getElementById(id);
  const list = $('results');
  let reader = null;
  let statsTimer = 0;

  function show(codes, source) {
    if (list.querySelector('small:only-child')) list.innerHTML = '';
    for (const c of codes) {
      const li = document.createElement('li');
      li.innerHTML = `<b></b><small>${c.format} · ${source} · ${new Date(c.timestamp).toLocaleTimeString()}</small>`;
      li.querySelector('b').textContent = c.text;
      list.prepend(li);
    }
  }

  function showError(err) {
    const li = document.createElement('li');
    li.className = 'error';
    li.textContent = err.message ?? String(err);
    list.prepend(li);
  }

  function formats() {
    const v = $('formats').value;
    return v ? v.split(',') : undefined;
  }

  $('start').onclick = async () => {
    $('start').disabled = true;
    try {
      if (!reader) {
        reader = await BarcodeReader.create({ host: '#scanner', formats: formats() });
        reader.on('detected', (codes) => show(codes, 'camera'));
        reader.on('error', showError);
      }
      await reader.start();
      $('stop').disabled = false;
      statsTimer = setInterval(() => {
        const s = reader.stats;
        $('stats').textContent =
          `${s.fps.toFixed(0)} fps · decode ${s.decodeMs.toFixed(1)} ms · grab ${s.grabMs.toFixed(1)} ms · ` +
          `${s.frameWidth}×${s.frameHeight} · ${s.backend}${s.simd ? ' · simd' : ''}${s.worker ? ' · worker' : ''}`;
      }, 500);
    } catch (err) {
      showError(err);
      $('start').disabled = false;
    }
  };

  $('stop').onclick = async () => {
    clearInterval(statsTimer);
    await reader?.stop();
    $('stop').disabled = true;
    $('start').disabled = false;
  };

  $('formats').onchange = () => reader?.configure({ formats: formats() ?? [] });

  async function scanFile(file) {
    try {
      const codes = await scanImage(file, { formats: formats() });
      codes.length ? show(codes, file.name) : showError(new Error(`No code found in ${file.name}`));
    } catch (err) {
      showError(err);
    }
  }

  $('file').onchange = (e) => e.target.files[0] && scanFile(e.target.files[0]);
  const drop = $('drop');
  drop.ondragover = (e) => e.preventDefault();
  drop.ondrop = (e) => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) scanFile(e.dataTransfer.files[0]);
  };
</script>
</body>
</html>
