name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the Release workflow on the release-please branch, whose commits
  # (pushed with GITHUB_TOKEN) do not trigger this workflow by themselves.
  workflow_call:
    inputs:
      ref:
        description: Branch to test.
        type: string
        required: true

concurrency:
  # `inputs.ref` keeps a called run (release branch) out of the group of the
  # push run on main that called it, which it would otherwise cancel.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p scanner-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: WASM tests (Node.js)
        run: cargo test -p scanner-wasm --target wasm32-unknown-unknown --test web
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  web:
    name: SDK & demo — lint, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-toolchain
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end (headless Chromium, fake camera)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build the demo
        run: npm run generate
