name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the Release workflow on the release-please branch, whose
  # commits (pushed with GITHUB_TOKEN) trigger no `push` / `pull_request` run.
  # Running on that branch itself (not called from main with another ref to
  # check out) keeps its caches away from main's: CodeQL flagged the former
  # `workflow_call` + `ref` input as cache poisoning. Its checks then show up
  # on the release PR like on any other PR.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job names are required checks of the `main` ruleset: rename them
  # there too.
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
      - run: cargo fmt --all -- --check
      # Known vulnerabilities and unmaintained crates (RustSec advisory database).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p scanner-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: WASM tests (Node.js)
        run: cargo test -p scanner-wasm --target wasm32-unknown-unknown --test web
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  web:
    name: SDK & demo — lint, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end (headless Chromium, fake camera)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build the demo
        run: npm run generate
