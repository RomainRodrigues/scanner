name: Release

# Versioning is driven by Conventional Commits (see CLAUDE.md):
# 1. On every push to main, release-please opens / updates a "release PR" that
#    bumps the single project version (Cargo workspace + npm package) and writes
#    CHANGELOG.md from the commit messages.
# 2. Merging that PR tags the release, creates the GitHub release and publishes
#    the SDK to npm.
# `workflow_dispatch` publishes the current version by hand (first release).
#
# Security model: every job gets only the permissions it needs. In particular
# the job that can mint the npm publishing token (`id-token: write`) installs
# and runs **nothing** from npm: the package is built and packed by an
# unprivileged job, and the publish job only uploads that tarball. A compromised
# build dependency therefore cannot publish to npm.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please edits Cargo.toml and package.json but not the lockfiles,
  # which also record the workspace versions: refresh them on the release PR.
  sync-lockfiles:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Update workspace versions in lockfiles
        run: |
          cargo update --workspace
          npm install --package-lock-only --ignore-scripts
      - name: Commit
        run: |
          if git diff --quiet -- Cargo.lock package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync lockfiles with the release version" -- Cargo.lock package-lock.json
          git push

  # Commits pushed with GITHUB_TOKEN trigger no workflow, so the release PR
  # gets no CI of its own. `workflow_dispatch` is the exception: run the CI on
  # the release branch once the lockfiles are synced. Its checks show up on
  # the release PR, like on any PR (required by the `main` ruleset).
  release-pr-ci:
    needs: sync-lockfiles
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.sync-lockfiles.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # Unprivileged: installs the npm dependencies and runs the build.
  package:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: npm run build
      - name: Pack the SDK
        run: |
          mkdir -p pkg
          npm pack -w @gueshbzh-perso/scanner --pack-destination pkg
          tar -tzf pkg/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Privileged (OIDC token for npm trusted publishing): no checkout, no
  # `npm install`, no build script. Only the tarball built above is published.
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      # Pinned: this job holds the publishing credential.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - name: Publish to npm
        # npm only accepts provenance from public repositories ("Unsupported GitHub
        # Actions source repository visibility: private", E422 on the 0.5.0 release).
        # Trusted publishing itself works from a private repository, so provenance
        # is turned off explicitly while the repository is private.
        run: npm publish ./*.tgz --access public ${{ github.event.repository.private && '--no-provenance' || '--provenance' }}

  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub release (manual runs only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/scanner-web/package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then exit 0; fi
          # Section of CHANGELOG.md for this version (up to the next "## [" heading).
          awk -v v="$version" '/^## \[/{p=index($0,"## [" v "]")==1; next} p' CHANGELOG.md > notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md
