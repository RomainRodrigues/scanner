# Keeps the pinned GitHub Actions (commit SHAs) and the dependencies up to date.
# Commit prefixes are not releasable types for release-please (`ci`, `build`),
# so dependency updates do not cut a release on their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # tsify 0.5 deprecates `into_wasm_abi` / `from_wasm_abi` (they leak the JS
      # value when deserialisation fails and throws) in favour of `tsify::Ts`:
      # a migration of the WASM bindings, planned separately. The success path
      # used per frame does not leak (measured: stable memory over 22k frames).
      - dependency-name: tsify
        update-types: [version-update:semver-major]
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # TypeScript is pinned to ~6.0: typescript-eslint (peer `<6.1.0`), vue-tsc
      # and vite-plugin-checker do not support TypeScript 7 yet (`npm ci` fails
      # with ERESOLVE). Lift this once they do.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types must match the Node.js version the project targets (22), not the latest.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm:
        update-types: [minor, patch]
