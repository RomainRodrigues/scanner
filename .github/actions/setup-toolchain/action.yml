name: Setup toolchain
description: Rust (stable + wasm32 target), wasm-bindgen CLI pinned by Cargo.lock, Node.js and npm dependencies (incl. binaryen / wasm-opt).

inputs:
  node:
    description: Also set up Node.js and install npm dependencies.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Read wasm-bindgen version from Cargo.lock
      id: versions
      shell: bash
      run: |
        version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
        echo "wasm-bindgen=$version" >> "$GITHUB_OUTPUT"

    # Prebuilt binaries: much faster than `cargo install`.
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
      with:
        tool: wasm-bindgen@${{ steps.versions.outputs.wasm-bindgen }}

    - if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        registry-url: https://registry.npmjs.org

    - if: inputs.node == 'true'
      shell: bash
      run: npm ci
