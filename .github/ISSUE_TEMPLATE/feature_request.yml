name: Feature request
description: A new format, option or behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The use case, rather than the solution (what you scan, on which devices).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
